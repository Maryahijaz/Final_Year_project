<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustZAI Monitoring — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon">📊</div>
                <h1>Monitoring</h1>
                <p>TrustZAI Security Monitor</p>
                <span class="badge">Powered by Mistral</span>
            </div>

            {% if error %}
            <div class="alert">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="monitor_admin" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-login">🔐 Login</button>
            </form>

            <div class="info">
                <p>Independent monitoring system</p>
                <p>Separate from TrustZAI Agent</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
